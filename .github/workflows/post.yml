name: Publish due Instagram posts

on:
  schedule:
    # Every 30 minutes. GitHub cron runs in UTC and can be delayed by several minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write

# Never let two runs publish at the same time.
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate queue
        run: node src/validate.js

      - name: Publish due posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node src/post.js --dry-run
          else
            node src/post.js
          fi

      # Save status changes (pending -> posted/failed) back to the repo so a post is never repeated.
      - name: Commit queue updates
        if: always()
        run: |
          if [ -n "$(git status --porcelain queue/posts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue/posts.json
            git commit -m "chore: update post queue status [skip ci]"
            git push
          fi
