name: Validate queue

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "queue/**"
      - "src/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/validate.js
